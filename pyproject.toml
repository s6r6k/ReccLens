[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recclens"
version = "0.1.0"
description = "Multimodal, multilingual product matching and search for SEA e-commerce"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.50",
    "peft>=0.13",
    "pytorch-metric-learning>=2.6",
    "wandb>=0.18",
    "pillow>=10.0",
]
queries = ["anthropic>=0.70"]
data = ["kaggle>=1.6"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["recclens*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
